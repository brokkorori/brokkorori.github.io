<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>画像圧縮ツール｜JPEG・PNG・WebPを高品質のまま圧縮できる無料オンラインツール</title>

<meta name="description" content="画像を高品質のまま圧縮できる無料オンラインツール。JPEG・PNG・WebPに対応し、ドラッグ＆ドロップで簡単にファイルサイズを削減できます。複数画像の一括圧縮にも対応。">

<meta name="keywords" content="画像圧縮, JPEG圧縮, PNG圧縮, WebP圧縮, ファイルサイズ削減, 画像軽量化, 無料ツール">

<meta property="og:title" content="画像圧縮ツール｜JPEG・PNG・WebPを高品質のまま圧縮できる無料オンラインツール">
<meta property="og:description" content="ブラウザだけでJPEG・PNG・WebPのファイルサイズを削減できる無料オンラインツール。複数画像の一括圧縮にも対応。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://brokkorori.github.io/image-convert/ogp.jpg">
<meta property="og:url" content="https://brokkorori.github.io/compress/">

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 900px;
        margin: auto;
        background: #fff;
        color: #333;
    }
    h1 {
        text-align: center;
        margin-bottom: 10px;
    }
    #dropZone {
        width: 100%;
        min-height: 200px;
        padding: 20px;
        border: 2px dashed #88a;
        background: #eef5ff;
        border-radius: 10px;
        text-align: center;
        margin-top: 20px;
        transition: 0.2s;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        justify-content: flex-start;
    }
    .thumb {
        width: 120px;
        text-align: center;
        font-size: 12px;
    }
    .thumb img {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
    }
    button {
        background: #007bff;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
    }
    button:hover {
        background: #005fcc;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }
        #dropZone {
            min-height: 150px;
            padding: 10px;
        }
        .thumb {
            width: 90px;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            font-size: 20px;
            padding: 16px;
        }
    }
</style>
</head>
<body>

<h1>画像圧縮ツール（JPEG / PNG / WebP）</h1>

<p style="text-align:center;color:#555;">
この画像圧縮ツールは、ブラウザだけで JPEG・PNG・WebP のファイルサイズを削減できる無料オンラインサービスです。
画質を保ちながら圧縮でき、複数画像の一括圧縮にも対応しています。インストール不要で、ドラッグ＆ドロップするだけで簡単に使えます。
</p>

<div id="dropZone">ここに画像をドラッグ＆ドロップ</div>

<br>
<input type="file" id="fileInput" multiple><br><br>

<label>圧縮率（品質）: <span id="qualityValue">0.8</span></label>
<input type="range" id="quality" min="0.1" max="1" step="0.1" value="0.8">

<button onclick="compressImages()">画像を圧縮する（複数対応）</button>

<button onclick="resetImages()" style="background:#888;margin-top:10px;">
    画像をリセットする
</button>

<p style="margin-top:30px; text-align:center;">
    <a href="/">トップページに戻る</a>
</p>

<script>
let selectedFiles = [];

const dropZone = document.getElementById("dropZone");

dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.style.background = "#ddeaff";
});

dropZone.addEventListener("dragleave", () => {
    dropZone.style.background = "#eef5ff";
});

dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.style.background = "#eef5ff";
    addFiles([...e.dataTransfer.files]);
});

document.getElementById("fileInput").addEventListener("change", (e) => {
    addFiles([...e.target.files]);
});

function addFiles(files) {
    selectedFiles = selectedFiles.concat(files);
    showThumbnails();
}

function showThumbnails() {
    dropZone.innerHTML = "";
    selectedFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const div = document.createElement("div");
            div.className = "thumb";
            div.innerHTML = `
                <img src="${e.target.result}">
                <div>${file.name}</div>
            `;
            dropZone.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

document.getElementById("quality").addEventListener("input", (e) => {
    document.getElementById("qualityValue").innerText = e.target.value;
});

function compressImages() {
    if (selectedFiles.length === 0) return alert("画像を選んでください");

    const quality = parseFloat(document.getElementById("quality").value);

    selectedFiles.forEach((file, index) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const baseName = file.name.replace(/\.[^/.]+$/, "");
                download(url, `${baseName}_compressed_${index}.jpg`);
            }, "image/jpeg", quality);
        };
        img.src = URL.createObjectURL(file);
    });

    alert("圧縮が完了しました！");
}

function download(url, filename) {
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
}

function resetImages() {
    selectedFiles = [];
    dropZone.innerHTML = "ここに画像をドラッグ＆ドロップ";
    document.getElementById("fileInput").value = "";
}
</script>

</body>
</html>
