<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像トリミングツール｜無料で簡単</title>

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 900px;
        margin: auto;
        background: #fff;
        color: #333;
    }
    h1 {
        text-align: center;
        margin-bottom: 10px;
    }
    #dropZone {
        width: 100%;
        min-height: 200px;
        padding: 20px;
        border: 2px dashed #88a;
        background: #eef5ff;
        border-radius: 10px;
        text-align: center;
        margin-top: 20px;
        transition: 0.2s;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        justify-content: flex-start;
    }
    .thumb {
        width: 120px;
        text-align: center;
        font-size: 12px;
    }
    .thumb img {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    /* ★ PCでもスマホでも見やすい入力欄 */
    .inputBox {
        background: #f7f7f7;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #ccc;
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }
    .inputItem {
        display: flex;
        flex-direction: column;
        width: 200px;
    }
    .inputItem label {
        font-weight: bold;
        margin-bottom: 5px;
    }
    .inputItem input {
        padding: 10px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #aaa;
    }

    /* ★ プレビュー */
    #previewZone {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }
    .previewItem {
        text-align: center;
    }
    .previewItem img {
        max-width: 200px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        background: #007bff;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
    }
    button:hover {
        background: #005fcc;
    }

    /* ★ スマホ最適化 */
    @media (max-width: 600px) {
        .thumb { width: 90px; }
        .inputBox { flex-direction: column; }
        .inputItem { width: 100%; }
        .previewItem img { max-width: 150px; }
        button { font-size: 20px; padding: 16px; }
    }
</style>
</head>
<body>

<h1>画像トリミングツール</h1>
<p style="text-align:center;color:#555;">
画像をドラッグ＆ドロップして、指定した範囲でトリミングできます。
</p>

<div id="dropZone">ここに画像をドラッグ＆ドロップ</div>

<br>
<input type="file" id="fileInput" multiple><br><br>

<!-- ★ PCでも見やすい入力欄 -->
<div class="inputBox">
    <div class="inputItem">
        <label>切り取り開始位置（x）</label>
        <input type="number" id="cropX" value="0">
    </div>

    <div class="inputItem">
        <label>切り取り開始位置（y）</label>
        <input type="number" id="cropY" value="0">
    </div>

    <div class="inputItem">
        <label>切り取り幅（w）</label>
        <input type="number" id="cropW" value="300">
    </div>

    <div class="inputItem">
        <label>切り取り高さ（h）</label>
        <input type="number" id="cropH" value="300">
    </div>
</div>

<button onclick="cropImages()">画像をトリミングする（複数対応）</button>

<button onclick="resetImages()" style="background:#888;margin-top:10px;">
    画像をリセットする
</button>

<h2 style="margin-top:30px;">トリミング結果プレビュー</h2>
<div id="previewZone"></div>

<p style="margin-top:30px; text-align:center;">
    <a href="/">トップページに戻る</a>
</p>

<script>
let selectedFiles = [];

const dropZone = document.getElementById("dropZone");
const previewZone = document.getElementById("previewZone");

dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.style.background = "#ddeaff";
});

dropZone.addEventListener("dragleave", () => {
    dropZone.style.background = "#eef5ff";
});

dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.style.background = "#eef5ff";
    addFiles([...e.dataTransfer.files]);
});

document.getElementById("fileInput").addEventListener("change", (e) => {
    addFiles([...e.target.files]);
});

function addFiles(files) {
    selectedFiles = selectedFiles.concat(files);
    showThumbnails();
}

function showThumbnails() {
    dropZone.innerHTML = "";
    selectedFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const div = document.createElement("div");
            div.className = "thumb";
            div.innerHTML = `
                <img src="${e.target.result}">
                <div>${file.name}</div>
            `;
            dropZone.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

function cropImages() {
    if (selectedFiles.length === 0) return alert("画像を選んでください");

    previewZone.innerHTML = "";

    const cropX = parseInt(document.getElementById("cropX").value);
    const cropY = parseInt(document.getElementById("cropY").value);
    const cropW = parseInt(document.getElementById("cropW").value);
    const cropH = parseInt(document.getElementById("cropH").value);

    selectedFiles.forEach((file, index) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext("2d");

            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const baseName = file.name.replace(/\.[^/.]+$/, "");

                const previewDiv = document.createElement("div");
                previewDiv.className = "previewItem";
                previewDiv.innerHTML = `
                    <img src="${url}">
                    <div>${baseName}_cropped_${index}.png</div>
                `;
                previewZone.appendChild(previewDiv);

                download(url, `${baseName}_cropped_${index}.png`);
            });
        };
        img.src = URL.createObjectURL(file);
    });

    alert("トリミングが完了しました！");
}

function resetImages() {
    selectedFiles = [];
    dropZone.innerHTML = "ここに画像をドラッグ＆ドロップ";
    previewZone.innerHTML = "";
    document.getElementById("fileInput").value = "";

    document.getElementById("cropX").value = 0;
    document.getElementById("cropY").value = 0;
    document.getElementById("cropW").value = 300;
    document.getElementById("cropH").value = 300;
}

function download(url, filename) {
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
}
</script>

</body>
</html>
