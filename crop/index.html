<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>画像トリミングツール｜ドラッグで簡単に切り抜きできる無料オンライン編集</title>

<meta name="description" content="画像の不要な部分をドラッグで簡単に切り抜きできる無料オンライン画像トリミングツール。JPEG・PNG・WebP対応。ブラウザ内で処理されるため安全で高速。">

<meta name="keywords" content="画像トリミング, 画像切り抜き, クロップ, トリミングツール, 無料画像編集, オンライン画像編集">

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 900px;
        margin: auto;
        background: #fff;
        color: #333;
    }
    h1 {
        text-align: center;
        margin-bottom: 10px;
    }
    #dropZone {
        width: 100%;
        min-height: 200px;
        padding: 20px;
        border: 2px dashed #88a;
        background: #eef5ff;
        border-radius: 10px;
        text-align: center;
        margin-top: 20px;
        transition: 0.2s;
    }
    #canvasWrapper {
        position: relative;
        margin-top: 20px;
        text-align: center;
    }
    #mainCanvas {
        max-width: 100%;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
    #cropArea {
        position: absolute;
        border: 2px dashed red;
        background: rgba(255,0,0,0.2);
        pointer-events: none;
    }
    button {
        background: #007bff;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
    }
    button:hover {
        background: #005fcc;
    }
    #previewZone img {
        max-width: 300px;
        margin-top: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
</style>
</head>
<body>

<h1>画像トリミングツール（ドラッグで切り抜き）</h1>

<p style="text-align:center;color:#555;">
このツールは、画像の不要な部分をドラッグ操作で簡単に切り抜きできる無料オンラインサービスです。  
画像はすべてブラウザ内で処理され、外部にアップロードされないため安全に利用できます。
</p>

<div id="dropZone">ここに画像をドラッグ＆ドロップ</div>
<br>
<input type="file" id="fileInput">

<div id="canvasWrapper">
    <canvas id="mainCanvas"></canvas>
    <div id="cropArea"></div>
</div>

<button id="cropButton">選択範囲をトリミングする</button>

<h2 style="margin-top:30px;">トリミング結果</h2>
<div id="previewZone"></div>

<p style="margin-top:30px; text-align:center;">
    <a href="/">トップページに戻る</a>
</p>

<script>
let img = new Image();
let canvas = document.getElementById("mainCanvas");
let ctx = canvas.getContext("2d");

let cropArea = document.getElementById("cropArea");
let startX, startY, endX, endY;
let isDragging = false;

document.getElementById("dropZone").addEventListener("dragover", e => {
    e.preventDefault();
});
document.getElementById("dropZone").addEventListener("drop", e => {
    e.preventDefault();
    loadImage(e.dataTransfer.files[0]);
});
document.getElementById("fileInput").addEventListener("change", e => {
    loadImage(e.target.files[0]);
});

function loadImage(file) {
    img.src = URL.createObjectURL(file);
    img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
    };
}

canvas.addEventListener("mousedown", e => {
    isDragging = true;
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX - rect.left;
    startY = e.clientY - rect.top;
});

canvas.addEventListener("mousemove", e => {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    endX = e.clientX - rect.left;
    endY = e.clientY - rect.top;

    const x = Math.min(startX, endX);
    const y = Math.min(startY, endY);
    const w = Math.abs(startX - endX);
    const h = Math.abs(startY - endY);

    cropArea.style.left = x + "px";
    cropArea.style.top = y + "px";
    cropArea.style.width = w + "px";
    cropArea.style.height = h + "px";
});

canvas.addEventListener("mouseup", () => {
    isDragging = false;
});

document.getElementById("cropButton").addEventListener("click", () => {
    const rect = cropArea.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();

    const x = rect.left - canvasRect.left;
    const y = rect.top - canvasRect.top;
    const w = rect.width;
    const h = rect.height;

    const cropCanvas = document.createElement("canvas");
    cropCanvas.width = w;
    cropCanvas.height = h;
    const cropCtx = cropCanvas.getContext("2d");

    cropCtx.drawImage(img, x, y, w, h, 0, 0, w, h);

    cropCanvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        document.getElementById("previewZone").innerHTML =
            `<img src="${url}">`;
    });
});
</script>

</body>
</html>
