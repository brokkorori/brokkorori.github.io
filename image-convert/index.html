<title>画像変換ツール｜JPEG・PNG・WebP・HEICに一括変換できる無料オンラインツール</title>

<meta name="description" content="画像をドラッグ＆ドロップするだけでJPEG・PNG・WebPに変換できる無料オンラインツール。iPhoneのHEIC画像にも対応し、複数画像の一括変換が可能。インストール不要でスマホでも利用できます。">

<meta name="keywords" content="画像変換, JPEG変換, PNG変換, WebP変換, HEIC変換, iPhone画像, 一括変換, 無料ツール, オンライン画像編集">

<meta property="og:title" content="画像変換ツール｜JPEG・PNG・WebP・HEICに一括変換できる無料オンラインツール">
<meta property="og:description" content="ブラウザだけでJPEG・PNG・WebPに変換できる無料オンラインツール。iPhoneのHEIC画像にも対応。">

<!-- ★ HEIC対応ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 900px;
        margin: auto;
        background: #fff;
        color: #333;
    }
    h1 {
        text-align: center;
        margin-bottom: 10px;
    }
    #dropZone {
        width: 100%;
        min-height: 200px;
        padding: 20px;
        border: 2px dashed #88a;
        background: #eef5ff;
        border-radius: 10px;
        text-align: center;
        margin-top: 20px;
        transition: 0.2s;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        justify-content: flex-start;
    }
    .thumb {
        width: 120px;
        text-align: center;
        font-size: 12px;
    }
    .thumb img {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
    }
    button {
        background: #007bff;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
    }
    button:hover {
        background: #005fcc;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }
        #dropZone {
            min-height: 150px;
            padding: 10px;
        }
        .thumb {
            width: 90px;
        }
        select {
            width: 100%;
            font-size: 18px;
            padding: 12px;
            margin-top: 10px;
        }
        button {
            font-size: 20px;
            padding: 16px;
        }
    }
</style>
</head>
<body>

<h1>画像変換ツール（JPEG / PNG / WebP / HEIC対応）</h1>

<p style="text-align:center;color:#555;">
この画像変換ツールは、ブラウザだけで JPEG・PNG・WebP に変換できる無料オンラインサービスです。
iPhoneのHEIC画像にも対応し、複数画像の一括変換が可能。ドラッグ＆ドロップするだけで簡単に使えます。
</p>

<div id="dropZone">ここに画像をドラッグ＆ドロップ</div>

<br>
<input type="file" id="fileInput" multiple><br><br>

<select id="format">
    <option value="image/jpeg">JPEG に変換</option>
    <option value="image/png">PNG に変換</option>
    <option value="image/webp">WebP に変換</option>
</select>

<button onclick="convertImages()">画像を変換する（複数対応）</button>

<button onclick="resetImages()" style="background:#888;margin-top:10px;">
    画像をリセットする
</button>

<p style="margin-top:30px; text-align:center;">
    <a href="/">トップページに戻る</a>
</p>

<script>
let selectedFiles = [];

// ドロップゾーン
const dropZone = document.getElementById("dropZone");

dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.style.background = "#ddeaff";
});

dropZone.addEventListener("dragleave", () => {
    dropZone.style.background = "#eef5ff";
});

dropZone.addEventListener("drop", async (e) => {
    e.preventDefault();
    dropZone.style.background = "#eef5ff";
    await addFiles([...e.dataTransfer.files]);
});

// ファイル選択
document.getElementById("fileInput").addEventListener("change", async (e) => {
    await addFiles([...e.target.files]);
});

// ★ HEIC対応を含むファイル追加処理
async function addFiles(files) {
    for (const file of files) {
        if (file.type === "image/heic" || file.name.toLowerCase().endsWith(".heic")) {
            try {
                const convertedBlob = await heic2any({
                    blob: file,
                    toType: "image/jpeg",
                    quality: 0.9
                });

                const newFile = new File([convertedBlob], file.name.replace(/\.heic$/i, ".jpg"), {
                    type: "image/jpeg"
                });

                selectedFiles.push(newFile);
            } catch (err) {
                alert("HEIC画像の変換に失敗しました");
            }
        } else {
            selectedFiles.push(file);
        }
    }

    showThumbnails();
}

// サムネイル表示
function showThumbnails() {
    dropZone.innerHTML = "";
    selectedFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const div = document.createElement("div");
            div.className = "thumb";
            div.innerHTML = `
                <img src="${e.target.result}">
                <div>${file.name}</div>
            `;
            dropZone.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

// 画像変換処理
function convertImages() {
    if (selectedFiles.length === 0) return alert("画像を選んでください");

    const format = document.getElementById("format").value;

    selectedFiles.forEach((file, index) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const baseName = file.name.replace(/\.[^/.]+$/, "");
                const ext = format.split("/")[1];
                download(url, `${baseName}_converted_${index}.${ext}`);
            }, format);
        };
        img.src = URL.createObjectURL(file);
    });

    alert("変換が完了しました！");
}

// ダウンロード
function download(url, filename) {
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
}

// 画像リセット機能
function resetImages() {
    selectedFiles = [];
    dropZone.innerHTML = "ここに画像をドラッグ＆ドロップ";
    document.getElementById("fileInput").value = "";
}
</script>

</body>
</html>
