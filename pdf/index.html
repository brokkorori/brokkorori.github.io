<meta name="description" content="画像をPDFに変換したり、PDFを画像に変換できる無料オンラインツール。ドラッグ＆ドロップ対応で、複数画像のPDF化やPDFページのPNG出力が簡単にできます。インストール不要でスマホでも利用可能。">

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 900px;
        margin: auto;
        background: #fff;
        color: #333;
        line-height: 1.8;
    }
    h1, h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    #dropZoneImg, #dropZonePdf {
        width: 100%;
        min-height: 200px;
        padding: 20px;
        border: 2px dashed #88a;
        background: #eef5ff;
        border-radius: 10px;
        text-align: center;
        margin-top: 20px;
        transition: 0.2s;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        justify-content: flex-start;
    }
    .thumb {
        width: 120px;
        text-align: center;
        font-size: 12px;
    }
    .thumb img {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #ccc;
    }
    button {
        background: #007bff;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 8px;

        margin-top: 20px;
        width: 100%;
    }
    button:hover {
        background: #005fcc;
    }
    @media (max-width: 600px) {
        .thumb { width: 90px; }
        button { font-size: 20px; padding: 16px; }
    }

<body>

<h1>PDF変換ツール（画像→PDF / PDF→画像）</h1>

<p style="text-align:center;color:#555;">
このPDF変換ツールは、画像をPDFに変換したり、PDFを画像に変換できる無料オンラインサービスです。
複数画像のPDF化や、PDFページのPNG出力に対応。ドラッグ＆ドロップするだけで簡単に使え、インストール不要でスマホでも利用できます。
</p>

<!-- 画像 → PDF -->
<h2>画像 → PDF 変換</h2>

<div id="dropZoneImg">ここに画像をドラッグ＆ドロップ</div>

<br>
<input type="file" id="fileInputImg" multiple><br><br>

<button onclick="convertToPDF()">画像をPDFに変換する</button>

<button onclick="resetImages()" style="background:#888;margin-top:10px;">
    画像をリセットする
</button>

<hr style="margin:40px 0;">

<!-- PDF → 画像 -->
<h2>PDF → 画像 変換</h2>

<div id="dropZonePdf">ここにPDFをドラッグ＆ドロップ</div>

<br>
<input type="file" id="fileInputPdf" accept="application/pdf"><br><br>

<button onclick="convertPdfToImages()">PDFを画像に変換する</button>

<button onclick="resetPdf()" style="background:#888;margin-top:10px;">
    PDFをリセットする
</button>

<p style="margin-top:40px; text-align:center;">
    <a href="/">トップページに戻る</a>
</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
let selectedImages = [];
let selectedPdf = null;

/* ------------------------------
   画像 → PDF
------------------------------ */

const dropZoneImg = document.getElementById("dropZoneImg");

dropZoneImg.addEventListener("dragover", e => {
    e.preventDefault();
    dropZoneImg.style.background = "#ddeaff";
});
dropZoneImg.addEventListener("dragleave", () => {
    dropZoneImg.style.background = "#eef5ff";
});
dropZoneImg.addEventListener("drop", e => {
    e.preventDefault();
    dropZoneImg.style.background = "#eef5ff";
    addImages([...e.dataTransfer.files]);
});

document.getElementById("fileInputImg").addEventListener("change", e => {
    addImages([...e.target.files]);
});

function addImages(files) {
    selectedImages = selectedImages.concat(files);
    showImageThumbs();
}

function showImageThumbs() {
    dropZoneImg.innerHTML = "";
    selectedImages.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
            const div = document.createElement("div");
            div.className = "thumb";
            div.innerHTML = `
                <img src="${e.target.result}">
                <div>${file.name}</div>
            `;
            dropZoneImg.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

function convertToPDF() {
    if (selectedImages.length === 0) return alert("画像を選んでください");

    const pdf = new jspdf.jsPDF();

    selectedImages.forEach((file, index) => {
        const img = new Image();
        img.onload = () => {
            const w = pdf.internal.pageSize.getWidth();
            const h = pdf.internal.pageSize.getHeight();
            pdf.addImage(img, "JPEG", 0, 0, w, h);
            if (index < selectedImages.length - 1) pdf.addPage();
            if (index === selectedImages.length - 1) {
                pdf.save("converted.pdf");
                alert("PDF変換が完了しました！");
            }
        };
        img.src = URL.createObjectURL(file);
    });
}

function resetImages() {
    selectedImages = [];
    dropZoneImg.innerHTML = "ここに画像をドラッグ＆ドロップ";
    document.getElementById("fileInputImg").value = "";
}

/* ------------------------------
   PDF → 画像
------------------------------ */

const dropZonePdf = document.getElementById("dropZonePdf");

dropZonePdf.addEventListener("dragover", e => {
    e.preventDefault();
    dropZonePdf.style.background = "#ddeaff";
});
dropZonePdf.addEventListener("dragleave", () => {
    dropZonePdf.style.background = "#eef5ff";
});
dropZonePdf.addEventListener("drop", e => {
    e.preventDefault();
    dropZonePdf.style.background = "#eef5ff";
    addPdf(e.dataTransfer.files[0]);
});

document.getElementById("fileInputPdf").addEventListener("change", e => {
    addPdf(e.target.files[0]);
});

function addPdf(file) {
    if (!file || file.type !== "application/pdf") {
        alert("PDFファイルを選んでください");
        return;
    }
    selectedPdf = file;
    dropZonePdf.innerHTML = `<div>${file.name}</div>`;
}

async function convertPdfToImages() {
    if (!selectedPdf) return alert("PDFを選んでください");

    const pdfData = await selectedPdf.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;

    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: ctx, viewport }).promise;

        canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            download(url, `page_${i}.png`);
        });
    }

    alert("PDF → 画像変換が完了しました！");
}

function resetPdf() {
    selectedPdf = null;
    dropZonePdf.innerHTML = "ここにPDFをドラッグ＆ドロップ";
    document.getElementById("fileInputPdf").value = "";
}

function download(url, filename) {
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
}
</script>

</body>
